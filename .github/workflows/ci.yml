name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-package:
    name: Source and installed wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.13'
          - os: windows-2022
            python: '3.13'
          - os: macos-15
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install test and build dependencies
        run: python -m pip install -r sku-kit/requirements.txt "build==1.3.0" "PyYAML==6.0.3"
      - name: Validate source, repository documents and issue forms
        run: python scripts/check_repository.py --javascript
      - name: Test Python source
        working-directory: sku-kit
        run: python -m unittest discover -s tests -v
      - name: Test browser project helpers
        run: node --test sku-kit/tests/project.test.mjs
      - name: Build wheel using declared package metadata
        run: python -m build --wheel --outdir dist
      - name: Prepare platform runtime dependency wheels
        run: >-
          python -m pip download --only-binary=:all: --dest wheelhouse -r sku-kit/requirements.txt
      - name: Install offline into a clean venv and exercise public entry points
        run: python scripts/check_package.py --wheel-dir dist --wheelhouse wheelhouse
