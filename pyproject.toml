[build-system]
requires = ["setuptools>=77.0.3", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sku-kit"
dynamic = ["version"]
description = "Local SKU spreadsheet and product-image validation, matching, and delivery tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow>=13.0.0,<14"]
keywords = ["sku", "product-images", "csv", "xlsx", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
sku-kit = "sku_kit.desktop:main"
sku-kit-cli = "sku_kit.cli:main"
sku-kit-mcp = "sku_kit.mcp_server:main"

[project.urls]
Repository = "https://github.com/Yixun-ai/-"
Issues = "https://github.com/Yixun-ai/-/issues"

[tool.setuptools]
packages = ["sku_kit"]
include-package-data = false

[tool.setuptools.package-dir]
sku_kit = "sku-kit"

[tool.setuptools.package-data]
sku_kit = ["static/*.html", "static/*.css", "static/*.mjs"]

[tool.setuptools.dynamic]
version = {attr = "sku_kit._version.VERSION"}
